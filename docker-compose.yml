services:
  db:
    image: postgres:15-alpine
    container_name: subven2-db-1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-subven2_db}
    volumes:
      - subven2_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-subven2_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subven2-web-1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password123}@db:5432/${POSTGRES_DB:-subven2_db}?schema=public
      AUTO_SEED: ${AUTO_SEED:-true}
    ports:
      - "${APP_PORT:-3006}:3000"

volumes:
  subven2_pgdata:
    name: subven2_postgres_data

networks:
  default:
    name: subven2_default
